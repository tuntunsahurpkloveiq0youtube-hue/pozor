<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Позор Squad</title>
<style>
:root{
  --bg-0:#1b1c21; --bg-1:#23252c; --bg-2:#2b2e37; --bg-3:#353945;
  --line:#3a3e4a; --fg:#eef0f5; --fg-2:#a5aab8; --fg-3:#6f7585;
  --accent:#ff5a4e; --accent-ink:#1d0c0a; --ok:#5fd38d; --warn:#f0b64a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-0);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:72px 240px minmax(0,1fr) 216px;height:100%}
.servers{background:var(--bg-0);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px}
.srv{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}

.side{background:var(--bg-1);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.side-h{padding:14px 16px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:16px 16px 6px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#channels{flex:1;min-height:0;overflow-y:auto;padding:0 8px;display:flex;flex-direction:column;gap:2px}
.ch{display:flex;align-items:center;gap:6px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.ch:hover{background:var(--bg-2);color:var(--fg)}
.ch.on{background:var(--bg-3);color:var(--fg)}
.hash{color:var(--fg-3);font-weight:700}
.add{margin:6px 8px;border:1px dashed var(--line);background:none;color:var(--fg-2);padding:7px;border-radius:6px;flex:none}
.add:hover{color:var(--fg);border-color:var(--fg-3)}
.addrow{margin:0 8px 6px;flex:none}
.addrow input{width:100%;background:var(--bg-0);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}

.voice{border-top:1px solid var(--line);padding:8px 8px 4px;flex:none}
.voice-list{display:flex;flex-direction:column;gap:2px;padding:4px 8px 0;max-height:140px;overflow-y:auto}
.vmem{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13px;min-width:0}
.vmem span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.voice-btns{display:flex;gap:6px;padding:4px 0 6px}
.vbtn{flex:1;border:0;border-radius:6px;padding:7px 8px;background:var(--ok);color:#0f1f16;font-weight:700}
.vbtn.leave{background:var(--bg-3);color:var(--fg)}
.vbtn.mute{background:var(--bg-3);color:var(--fg);flex:0 0 auto}
.vbtn.mute.off{background:var(--warn);color:#2a1d05}

.me{border-top:1px solid var(--line);padding:8px;background:var(--bg-0);flex:none}
.me-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px;border-radius:6px;text-align:left;min-width:0}
.me-btn:hover{background:var(--bg-2)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#14151a;flex:none;background:hsl(var(--h) 70% 62%)}
.me-text{min-width:0;display:flex;flex-direction:column}
.me-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-sub{font-size:11px;color:var(--fg-3)}
.me-sub.ok{color:var(--ok)}
.me-sub.bad{color:var(--warn)}

.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--bg-2)}
.chat-h{display:flex;align-items:center;gap:8px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);min-width:0}
.chat-h .hash{font-size:20px}
#chTitle{font-weight:700;white-space:nowrap}
.sub{color:var(--fg-3);font-size:12px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msgs{overflow-y:auto;overflow-x:hidden;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;min-height:0}
.msg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:2px 8px;border-radius:6px;position:relative}
.msg:hover{background:rgba(255,255,255,.025)}
.msg.first{margin-top:14px}
.msg.sys{grid-template-columns:minmax(0,1fr);color:var(--fg-3);font-style:italic;padding:6px 8px;margin-top:10px}
.msg .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg .who{font-weight:700}
.msg .time{font-size:11px;color:var(--fg-3)}
.msg .txt{overflow-wrap:anywhere}
.react{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--bg-1);border-radius:999px;padding:1px 8px;font-size:13px;color:var(--fg-2)}
.chip.mine{border-color:var(--accent);color:var(--fg)}
.tools{position:absolute;right:8px;top:-14px;display:none;gap:2px;background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:2px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.msg:hover .tools,.msg:focus-within .tools{display:flex}
.tools button{border:0;background:none;padding:4px 6px;border-radius:5px;font-size:14px;color:var(--fg)}
.tools button:hover{background:var(--bg-3)}
.empty{margin:auto;text-align:center;color:var(--fg-3);padding:24px}

.composer{display:flex;gap:10px;align-items:flex-end;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.composer textarea{flex:1;resize:none;max-height:160px;background:var(--bg-3);border:0;border-radius:8px;padding:10px 12px;outline:none;min-width:0}
.composer textarea::placeholder{color:var(--fg-3)}
#send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:700;flex:none}

.members{background:var(--bg-1);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.mem{display:flex;align-items:center;gap:8px;padding:5px 16px;color:var(--fg-2);min-width:0}
.mem .av{width:26px;height:26px;font-size:11px}
.mem .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.mem.off{opacity:.5}
.mem.me-row{color:var(--fg)}
.mem .mic{font-size:12px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--fg-2)}
.card input{background:var(--bg-0);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.card button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px;font-weight:700}
.card .err{color:var(--warn);min-height:1em;font-size:13px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-3);color:var(--fg);padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6;max-width:calc(100% - 32px)}

#remotes{display:none}

@media (max-width:900px){
  .app{grid-template-columns:72px 200px minmax(0,1fr)}
  .members{display:none}
}
@media (max-width:640px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .servers,.side-h,.section-label,.members,.voice-list{display:none}
  .side{flex-direction:row;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:6px}
  #channels{flex-direction:row;padding:0;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;min-width:0}
  .add,.addrow{margin:0;flex:none}
  .addrow input{width:140px}
  .voice{border-top:0;border-left:1px solid var(--line);padding:0 8px;flex:none}
  .voice-btns{padding:0}
  .me{border-top:0;border-left:1px solid var(--line);padding:0 0 0 8px;flex:none}
  .me-btn{width:auto;padding:4px}
  .me-sub{display:none}
  .me-name{max-width:90px}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <aside class="servers" aria-label="Серверы">
    <div class="srv" title="Позор Squad">П</div>
  </aside>

  <aside class="side">
    <header class="side-h">Позор Squad</header>
    <div class="section-label">Текстовые каналы</div>
    <nav id="channels" aria-label="Каналы"></nav>
    <button class="add" id="addBtn" type="button">+ Новый канал</button>
    <form class="addrow" id="addForm" hidden>
      <input id="addIn" placeholder="название канала" maxlength="24" autocomplete="off" aria-label="Название канала">
    </form>

    <div class="voice" aria-label="Голосовой канал">
      <div class="section-label" style="padding-left:8px;padding-top:8px">Голосовой канал</div>
      <div class="voice-list" id="voiceList"></div>
      <div class="voice-btns">
        <button class="vbtn" id="voiceBtn" type="button">Войти в голос</button>
        <button class="vbtn mute" id="muteBtn" type="button" hidden aria-label="Микрофон">Микрофон</button>
      </div>
    </div>

    <div class="me">
      <button class="me-btn" id="meBtn" type="button" title="Сменить ник">
        <span class="av" id="meAv"></span>
        <span class="me-text">
          <span class="me-name" id="meName"></span>
          <span class="me-sub" id="connState">…</span>
        </span>
      </button>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-h">
      <span class="hash">#</span>
      <span id="chTitle"></span>
      <span class="sub" id="chSub"></span>
    </header>
    <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Сначала войди" aria-label="Сообщение" disabled></textarea>
      <button id="send" type="submit" disabled>Отправить</button>
    </form>
  </main>

  <aside class="members">
    <div class="section-label">Участники</div>
    <div id="members"></div>
  </aside>
</div>

<div id="remotes"></div>

<div class="overlay" id="login" hidden>
  <form class="card" id="loginForm">
    <h2>Как тебя позорить?</h2>
    <p>Ник видят остальные участники.</p>
    <input id="nameIn" maxlength="20" placeholder="Твой ник" autocomplete="off" aria-label="Ник">
    <input id="codeIn" placeholder="Код доступа" autocomplete="off" aria-label="Код доступа" hidden>
    <div class="err" id="loginErr"></div>
    <button type="submit" id="loginBtn">Войти</button>
  </form>
</div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var ICE = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]};

  var S = {
    me: null, id: null, code: '', reactions: ['🔥','😂','💀','🤡'],
    channels: [], cur: null, msgs: {}, members: [], voice: [],
    inVoice: false, muted: false, localStream: null, peers: {}, es: null
  };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hue(name){ var h = 0; for (var i = 0; i < name.length; i++) h = (h*31 + name.charCodeAt(i)) % 360; return h; }
  function fmtTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}); }
  function avatar(name){ return '<span class="av" style="--h:' + hue(name) + '">' + esc(name.charAt(0).toUpperCase()) + '</span>'; }
  function plural(n, f){ var a = n % 10, b = n % 100; if (a === 1 && b !== 11) return f[0]; if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return f[1]; return f[2]; }

  function toast(text){
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3500);
  }

  function api(path, body){
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    return fetch(path + sep + 'code=' + encodeURIComponent(S.code), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) throw new Error(d.error || ('Ошибка ' + r.status));
        return d;
      });
    });
  }

  function setConn(text, cls){
    var el = $('#connState');
    el.textContent = text;
    el.className = 'me-sub' + (cls ? ' ' + cls : '');
  }

  // ----- Login and realtime connection -----

  function openLogin(err){
    $('#login').hidden = false;
    $('#loginErr').textContent = err || '';
    $('#nameIn').value = S.me || localStorage.getItem('squad-name') || '';
    $('#loginBtn').disabled = false;
    setTimeout(function(){ $('#nameIn').focus(); }, 0);
  }
  function closeLogin(){ $('#login').hidden = true; }

  function connect(name){
    S.me = name;
    localStorage.setItem('squad-name', name);
    if (S.code) localStorage.setItem('squad-code', S.code);
    var id = sessionStorage.getItem('squad-id');
    if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2)); sessionStorage.setItem('squad-id', id); }
    S.id = id;
    if (S.es) S.es.close();

    var es = new EventSource('/events?id=' + encodeURIComponent(id) + '&name=' + encodeURIComponent(name) + '&code=' + encodeURIComponent(S.code));
    S.es = es;
    setConn('подключение…');

    function on(evt, fn){ es.addEventListener(evt, function(e){ fn(JSON.parse(e.data)); }); }

    on('hello', function(d){
      S.channels = d.channels;
      S.members = d.members;
      S.voice = d.voice;
      if (!S.cur || !S.channels.some(function(c){ return c.id === S.cur; })) S.cur = S.channels[0].id;
      S.inVoice = S.inVoice && d.inVoice;
      setConn('в сети', 'ok');
      closeLogin();
      loadChannel(S.cur);
      renderAll(true);
      $('#input').disabled = false;
      $('#send').disabled = false;
      $('#input').placeholder = 'Написать в #' + currentChannel().name;
    });
    es.onerror = function(){ setConn('нет связи, переподключаюсь…', 'bad'); };
    on('presence', function(d){ S.members = d.members; renderMembers(); });
    on('channels', function(d){ S.channels = d.channels; renderChannels(); renderHeader(); });
    on('message', function(d){
      var list = S.msgs[d.channel];
      if (!list) return;
      if (list.some(function(m){ return m.id === d.msg.id; })) return;
      var near = isNearBottom();
      list.push(d.msg);
      if (d.channel === S.cur) { renderMessages(near || d.msg.author === S.me); renderHeader(); }
    });
    on('message-update', function(d){
      var list = S.msgs[d.channel]; if (!list) return;
      for (var i = 0; i < list.length; i++) if (list[i].id === d.msg.id) list[i] = d.msg;
      if (d.channel === S.cur) renderMessages(false);
    });
    on('message-delete', function(d){
      if (!S.msgs[d.channel]) return;
      S.msgs[d.channel] = S.msgs[d.channel].filter(function(m){ return m.id !== d.messageId; });
      if (d.channel === S.cur) { renderMessages(false); renderHeader(); }
    });
    on('voice', function(d){
      S.voice = d.members;
      if (S.inVoice) syncPeers();
      renderVoice();
      renderMembers();
    });
    on('signal', function(d){ handleSignal(d.from, d.data).catch(function(){}); });
  }

  $('#loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('#nameIn').value.trim().slice(0, 20);
    if (!name) return openLogin('Введи ник');
    var code = $('#codeIn').hidden ? '' : $('#codeIn').value.trim();
    S.code = code;
    $('#loginBtn').disabled = true;
    fetch('/api/check?code=' + encodeURIComponent(code), {cache:'no-store'}).then(function(r){
      if (r.status === 403) { $('#loginBtn').disabled = false; return openLogin('Неверный код доступа'); }
      if (!r.ok) { $('#loginBtn').disabled = false; return openLogin('Не получилось войти'); }
      connect(name);
    }).catch(function(){ $('#loginBtn').disabled = false; openLogin('Нет связи с сервером'); });
  });

  $('#meBtn').addEventListener('click', function(){ openLogin(); });

  // Init: показать поле кода, если сервер его требует; иначе войти сразу с сохранённым ником.
  fetch('/api/config').then(function(r){ return r.json(); }).then(function(cfg){
    if (cfg.needsCode) {
      $('#codeIn').hidden = false;
      $('#codeIn').value = localStorage.getItem('squad-code') || '';
    }
    S.code = cfg.needsCode ? (localStorage.getItem('squad-code') || '') : '';
    var saved = localStorage.getItem('squad-name');
    if (saved && (!cfg.needsCode || S.code)) {
      // сохранённый ник — подключаемся сразу; если код неверен, покажем форму
      fetch('/api/check?code=' + encodeURIComponent(S.code), {cache:'no-store'})
        .then(function(r){
          if (r.status === 403) { openLogin('Неверный код доступа'); return; }
          connect(saved);
        }).catch(function(){ openLogin(); });
    } else {
      openLogin();
    }
    S.reactions = cfg.reactions || S.reactions;
  }).catch(function(){ setConn('сервер недоступен', 'bad'); openLogin('Сервер не отвечает, попробуй позже'); });

  $('#login').addEventListener('click', function(e){ if (e.target === this && S.me) closeLogin(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      if (!$('#login').hidden && S.me) closeLogin();
      if (!$('#addForm').hidden) $('#addForm').hidden = true;
    }
  });

  // ----- Data helpers -----

  function currentChannel(){
    for (var i = 0; i < S.channels.length; i++) if (S.channels[i].id === S.cur) return S.channels[i];
    return S.channels[0] || {name: '…', id: null};
  }
  function curList(){ return S.msgs[S.cur] || []; }
  function isNearBottom(){
    var box = $('#msgs');
    return box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  }

  function loadChannel(ch){
    if (!ch) return;
    fetch('/api/messages?channel=' + encodeURIComponent(ch) + '&code=' + encodeURIComponent(S.code))
      .then(function(r){ return r.json(); })
      .then(function(d){
        S.msgs[ch] = d.messages || [];
        if (ch === S.cur) { renderMessages(true); renderHeader(); }
      }).catch(function(){ toast('Не получилось загрузить канал'); });
  }

  // ----- Rendering -----

  function renderAll(scroll){
    renderChannels();
    renderHeader();
    renderMessages(scroll);
    renderMembers();
    renderVoice();
    renderMe();
  }

  function renderChannels(){
    $('#channels').innerHTML = S.channels.map(function(c){
      return '<button class="ch' + (c.id === S.cur ? ' on' : '') + '" type="button" data-ch="' + c.id + '"><span class="hash">#</span>' + esc(c.name) + '</button>';
    }).join('');
  }

  function renderHeader(){
    var list = curList();
    $('#chTitle').textContent = currentChannel().name;
    $('#chSub').textContent = list.length ? list.length + ' ' + plural(list.length, ['сообщение','сообщения','сообщений']) : '';
  }

  function msgHTML(m, prev){
    if (m.sys) return '<div class="msg sys"><div class="txt">' + esc(m.text) + '</div></div>';
    var grouped = prev && !prev.sys && prev.author === m.author && (m.ts - prev.ts) < 5*60*1000;
    var reactions = m.reactions || {};
    var chips = Object.keys(reactions).filter(function(e){ return reactions[e].length; }).map(function(e){
      var arr = reactions[e];
      return '<button class="chip' + (arr.indexOf(S.me) >= 0 ? ' mine' : '') + '" type="button" data-react="' + m.id + '" data-e="' + e + '">' + e + ' ' + arr.length + '</button>';
    }).join('');
    var tools = S.reactions.map(function(e){
      return '<button type="button" data-react="' + m.id + '" data-e="' + e + '" aria-label="Реакция ' + e + '">' + e + '</button>';
    }).join('');
    if (m.author === S.me) tools += '<button type="button" data-del="' + m.id + '" aria-label="Удалить сообщение">🗑</button>';

    return '<div class="msg ' + (grouped ? 'cont' : 'first') + '">' +
      (grouped ? '<span class="av" style="visibility:hidden" aria-hidden="true"></span>' : avatar(m.author)) +
      '<div>' +
        (grouped ? '' : '<div class="meta"><span class="who">' + esc(m.author) + '</span><span class="time">' + fmtTime(m.ts) + '</span></div>') +
        '<div class="txt">' + esc(m.text).replace(/\n/g, '<br>') + '</div>' +
        (chips ? '<div class="react">' + chips + '</div>' : '') +
      '</div>' +
      '<div class="tools">' + tools + '</div>' +
    '</div>';
  }

  function renderMessages(scroll){
    var list = curList();
    var box = $('#msgs');
    box.innerHTML = list.length
      ? list.map(function(m, i){ return msgHTML(m, list[i-1]); }).join('')
      : '<div class="empty">Здесь пока тихо. Напиши первым, а то позорить будет нечего.</div>';
    if (scroll) box.scrollTop = box.scrollHeight;
  }

  function renderMembers(){
    var inVoiceIds = {};
    S.voice.forEach(function(v){ inVoiceIds[v.id] = true; });
    var list = S.members.slice().sort(function(a,b){ return a.name.localeCompare(b.name, 'ru'); });
    $('#members').innerHTML = list.length
      ? list.map(function(m){
          return '<div class="mem' + (m.id === S.id ? ' me-row' : '') + '">' + avatar(m.name) +
            '<span class="name">' + esc(m.name) + (m.id === S.id ? ' (ты)' : '') + '</span>' +
            (inVoiceIds[m.id] ? '<span class="mic" title="В голосе">🎙</span>' : '') + '</div>';
        }).join('')
      : '<div class="mem">Пусто</div>';
  }

  function renderVoice(){
    $('#voiceList').innerHTML = S.voice.map(function(v){
      return '<div class="vmem"><span class="dot"></span><span>' + esc(v.name) + (v.id === S.id ? ' (ты)' : '') + '</span></div>';
    }).join('');
    var btn = $('#voiceBtn');
    btn.textContent = S.inVoice ? 'Выйти из голоса' : 'Войти в голос';
    btn.className = 'vbtn' + (S.inVoice ? ' leave' : '');
    btn.disabled = !S.me;
    var mute = $('#muteBtn');
    mute.hidden = !S.inVoice;
    mute.textContent = S.muted ? 'Микрофон выкл.' : 'Микрофон вкл.';
    mute.className = 'vbtn mute' + (S.muted ? ' off' : '');
  }

  function renderMe(){
    var name = S.me || '?';
    $('#meName').textContent = S.me || 'Войти';
    $('#meAv').outerHTML = '<span class="av" id="meAv" style="--h:' + hue(name) + '">' + esc(name.charAt(0).toUpperCase()) + '</span>';
  }

  // ----- Text chat actions -----

  $('#channels').addEventListener('click', function(e){
    var b = e.target.closest('[data-ch]');
    if (!b) return;
    S.cur = b.getAttribute('data-ch');
    renderChannels();
    renderHeader();
    if (S.msgs[S.cur]) renderMessages(true); else { renderMessages(true); loadChannel(S.cur); }
    $('#input').placeholder = 'Написать в #' + currentChannel().name;
  });

  $('#addBtn').addEventListener('click', function(){
    $('#addForm').hidden = false;
    $('#addIn').focus();
  });
  $('#addIn').addEventListener('keydown', function(e){ if (e.key === 'Escape') $('#addForm').hidden = true; });
  $('#addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('#addIn').value.trim();
    if (!name) return;
    api('/api/channel', { id: S.id, name: name }).then(function(d){
      $('#addIn').value = '';
      $('#addForm').hidden = true;
      S.cur = d.channel.id;
      S.msgs[d.channel.id] = [];
      renderChannels(); renderHeader(); renderMessages(true);
      $('#input').placeholder = 'Написать в #' + d.channel.name;
    }).catch(function(err){ toast(err.message); });
  });

  $('#composer').addEventListener('submit', function(e){
    e.preventDefault();
    var input = $('#input');
    var text = input.value.trim();
    if (!text || !S.me) return;
    input.value = '';
    api('/api/message', { id: S.id, channel: S.cur, text: text }).catch(function(err){
      input.value = text;
      toast(err.message);
    });
    input.focus();
  });
  $('#input').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('#composer').requestSubmit();
    }
  });

  $('#msgs').addEventListener('click', function(e){
    var r = e.target.closest('[data-react]');
    if (r) {
      api('/api/react', { id: S.id, channel: S.cur, messageId: r.getAttribute('data-react'), emoji: r.getAttribute('data-e') })
        .catch(function(err){ toast(err.message); });
      return;
    }
    var d = e.target.closest('[data-del]');
    if (d) {
      // Первое нажатие просит подтвердить, второе удаляет (confirm() в просмотрщике не работает).
      if (d.getAttribute('data-armed') !== '1') {
        d.setAttribute('data-armed', '1');
        d.textContent = 'Удалить?';
        return;
      }
      api('/api/delete', { id: S.id, channel: S.cur, messageId: d.getAttribute('data-del') })
        .catch(function(err){ toast(err.message); });
    }
  });

  // ----- Voice (WebRTC mesh, сигналы через сервер) -----

  function signal(to, data){
    return api('/api/signal', { id: S.id, to: to, data: data }).catch(function(){});
  }

  function createPeer(pid, initiator){
    if (S.peers[pid]) return S.peers[pid];
    var pc = new RTCPeerConnection(ICE);
    var entry = { pc: pc, pending: [] };
    S.peers[pid] = entry;
    S.localStream.getTracks().forEach(function(t){ pc.addTrack(t, S.localStream); });

    pc.onicecandidate = function(e){
      if (e.candidate) signal(pid, { type: 'ice', candidate: e.candidate });
    };
    pc.ontrack = function(e){
      var a = document.getElementById('a-' + pid);
      if (!a) {
        a = document.createElement('audio');
        a.id = 'a-' + pid;
        a.autoplay = true;
        a.playsInline = true;
        $('#remotes').appendChild(a);
      }
      a.srcObject = e.streams[0];
    };
    pc.onconnectionstatechange = function(){
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') dropPeer(pid);
    };

    if (initiator) {
      pc.createOffer()
        .then(function(o){ return pc.setLocalDescription(o); })
        .then(function(){ signal(pid, { type: 'offer', sdp: pc.localDescription }); })
        .catch(function(){ dropPeer(pid); });
    }
    return entry;
  }

  function dropPeer(pid){
    var entry = S.peers[pid];
    if (entry) { try { entry.pc.close(); } catch(_){} }
    delete S.peers[pid];
    var a = document.getElementById('a-' + pid);
    if (a) a.remove();
  }

  function syncPeers(){
    var ids = {};
    S.voice.forEach(function(v){ ids[v.id] = true; });
    Object.keys(S.peers).forEach(function(pid){ if (!ids[pid]) dropPeer(pid); });
  }

  function flushPending(entry){
    entry.pending.forEach(function(c){ entry.pc.addIceCandidate(c).catch(function(){}); });
    entry.pending = [];
  }

  function handleSignal(from, d){
    if (!S.inVoice || !S.localStream) return Promise.resolve();
    if (d.type === 'offer') {
      if (S.peers[from]) dropPeer(from);
      var entry = createPeer(from, false);
      return entry.pc.setRemoteDescription(d.sdp)
        .then(function(){ flushPending(entry); return entry.pc.createAnswer(); })
        .then(function(ans){ return entry.pc.setLocalDescription(ans); })
        .then(function(){ return signal(from, { type: 'answer', sdp: entry.pc.localDescription }); });
    }
    var e2 = S.peers[from];
    if (!e2) return Promise.resolve();
    if (d.type === 'answer') {
      return e2.pc.setRemoteDescription(d.sdp).then(function(){ flushPending(e2); });
    }
    if (d.type === 'ice') {
      if (e2.pc.remoteDescription) return e2.pc.addIceCandidate(d.candidate).catch(function(){});
      e2.pending.push(d.candidate);
    }
    return Promise.resolve();
  }

  $('#voiceBtn').addEventListener('click', function(){
    if (S.inVoice) return leaveVoice();
    joinVoice();
  });

  function joinVoice(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return toast('Этот браузер не даёт доступ к микрофону');
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false })
      .then(function(stream){
        S.localStream = stream;
        S.inVoice = true;
        S.muted = false;
        return api('/api/voice', { id: S.id, join: true });
      })
      .then(function(d){
        S.voice = d.members;
        // Новичок подключается ко всем, кто уже в голосе. Остальные ответят сами.
        d.members.filter(function(m){ return m.id !== S.id; }).forEach(function(m){ createPeer(m.id, true); });
        renderVoice(); renderMembers();
      })
      .catch(function(err){
        if (S.localStream) { S.localStream.getTracks().forEach(function(t){ t.stop(); }); S.localStream = null; }
        S.inVoice = false;
        toast(err && err.name === 'NotAllowedError' ? 'Разреши доступ к микрофону в браузере' : 'Не получилось войти в голос');
        renderVoice();
      });
  }

  function leaveVoice(){
    Object.keys(S.peers).forEach(dropPeer);
    if (S.localStream) { S.localStream.getTracks().forEach(function(t){ t.stop(); }); S.localStream = null; }
    S.inVoice = false;
    S.muted = false;
    api('/api/voice', { id: S.id, join: false }).catch(function(){});
    renderVoice(); renderMembers();
  }

  $('#muteBtn').addEventListener('click', function(){
    if (!S.localStream) return;
    S.muted = !S.muted;
    S.localStream.getAudioTracks().forEach(function(t){ t.enabled = !S.muted; });
    renderVoice();
  });

  window.addEventListener('beforeunload', function(){
    if (S.inVoice) {
      // Попытка сообщить серверу, что мы вышли из голоса.
      navigator.sendBeacon && navigator.sendBeacon('/api/voice?code=' + encodeURIComponent(S.code), new Blob([JSON.stringify({id: S.id, join: false})], {type: 'application/json'}));
    }
  });
})();
</script>
